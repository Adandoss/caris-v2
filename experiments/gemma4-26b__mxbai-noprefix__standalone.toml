# Gemma 4 26B tags embedded without mxbai-embed-large's retrieval prefix, matched against each code's own text.
# Only [embedding].query_prefix differs from gemma4-26b__mxbai__standalone: does the model card's prefix matter?

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "tags_v1"
schema = "tags_v1"
temperature = 0.0
seed = 42
think = false  # reasoning before answering: much slower; compare it as its own experiment

[embedding]
model = "mxbai-embed-large"
text = "standalone"
query_prefix = ""

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0764, recall 0.0812, 4.74 codes per image.
top_k = 5
threshold = 0.82
