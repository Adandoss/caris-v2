# Gemma 4 26B tags, matched against each code's own text with mxbai-embed-large.

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "tags_v1"
schema = "tags_v1"
temperature = 0.0
seed = 42
think = false  # reasoning before answering: much slower; compare it as its own experiment

[embedding]
model = "mxbai-embed-large"
text = "standalone"
query_prefix = "Represent this sentence for searching relevant passages: "

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0776, recall 0.0801, 4.6 codes per image.
top_k = 5
threshold = 0.78
