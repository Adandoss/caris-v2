# The ablation for enforced structure: the old prompt asks for a comma-separated list and
# nothing is enforced. Compare with gemma4-26b__mxbai__standalone, which differs only in
# how the answer is requested.

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "keywords_v0"
schema = "none"
temperature = 0.0
seed = 42
think = false  # reasoning before answering: much slower; compare it as its own experiment

[embedding]
model = "mxbai-embed-large"
text = "standalone"
query_prefix = "Represent this sentence for searching relevant passages: "

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0477, recall 0.0968, 9.02 codes per image.
top_k = 10
threshold = 0.78
