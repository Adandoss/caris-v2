# Gemma 4 26B tags sampled at temperature 0.7 with seed 3, matched with mxbai-embed-large.
# One of three sampled runs: how much do tags vary when sampled, and does the union of samples find more?

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "tags_v1"
schema = "tags_v1"
temperature = 0.7
seed = 3
think = false  # reasoning before answering: much slower; compare it as its own experiment

[embedding]
model = "mxbai-embed-large"
text = "standalone"
query_prefix = "Represent this sentence for searching relevant passages: "

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0745, recall 0.0777, 4.63 codes per image.
top_k = 5
threshold = 0.78
