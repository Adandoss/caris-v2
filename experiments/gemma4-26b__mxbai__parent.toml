# Gemma 4 26B tags, matched against each code's parent text and its own text with mxbai-embed-large.
# Only [embedding].text differs from gemma4-26b__mxbai__standalone: one step of context, against the full path of hierarchical.

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "tags_v1"
schema = "tags_v1"
temperature = 0.0
seed = 42
think = false  # reasoning before answering: much slower; compare it as its own experiment

[embedding]
model = "mxbai-embed-large"
text = "parent"
query_prefix = "Represent this sentence for searching relevant passages: "

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0371, recall 0.0829, 9.95 codes per image.
top_k = 10
threshold = 0.68
