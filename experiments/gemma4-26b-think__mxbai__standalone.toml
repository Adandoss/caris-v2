# Gemma 4 26B tags with reasoning on, matched against each code's own text with mxbai-embed-large.
# Only [tagging].think differs from gemma4-26b__mxbai__standalone: does reasoning first change the tags?

[data]
split = "test"

[tagging]
model = "gemma4:26b"
prompt = "tags_v1"
schema = "tags_v1"
temperature = 0.0
seed = 42
think = true

[embedding]
model = "mxbai-embed-large"
text = "standalone"
query_prefix = "Represent this sentence for searching relevant passages: "

[selection]
# Chosen on val, the best pooled F1 of caris sweep --split val: pooled precision 0.0625, recall 0.067, 4.76 codes per image.
top_k = 5
threshold = 0.77
